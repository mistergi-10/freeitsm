services:
  # FreeITSM app - builds a thin wrapper around the upstream image that adds
  # a proper entrypoint script (dockerCommand has no shell, so && doesn't work)
  - type: web
    name: freeitsm
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: DB_SERVER
        fromService:
          name: freeitsm-db
          type: pserv
          property: host
      - key: DB_NAME
        value: freeitsm
      - key: DB_USERNAME
        value: freeitsm
      - key: DB_PASSWORD
        fromService:
          name: freeitsm-db
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: ENCRYPTION_KEY_PATH
        value: /var/www/encryption_keys/freeitsm.key
    # Single disk holding everything that must survive redeploys; app code
    # under /var/www/html stays baked into the image and untouched.
    disk:
      name: freeitsm-data
      mountPath: /data
      sizeGB: 10

  # MySQL as a private service (Render has no managed MySQL offering)
  - type: pserv
    name: freeitsm-db
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mysql:8.0
    envVars:
      - key: MYSQL_DATABASE
        value: freeitsm
      - key: MYSQL_USER
        value: freeitsm
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: freeitsm-db-data
      mountPath: /var/lib/mysql
      sizeGB: 10
