services:
  # FreeITSM app - pulls the prebuilt image (fast, no build step)
  - type: web
    name: freeitsm
    runtime: image
    plan: starter
    region: oregon
    image:
      url: ghcr.io/edmozley/freeitsm:latest
    # Redirect every path that needs to persist onto the single mounted
    # disk at /data via symlinks, then hand off to the image's normal CMD.
    dockerCommand: >-
      sh -c "
      mkdir -p /data/encryption_keys /data/tickets-attachments /data/change-management-attachments /data/uploads /data/recordings /data/lms-content /data/contracts-rfp-builder-uploads /data/system-uploads-branding /data/war-room-attachments &&
      chown -R www-data:www-data /data &&
      mkdir -p /var/www/html/tickets /var/www/html/change-management /var/www/html/lms /var/www/html/contracts/rfp-builder /var/www/html/system/uploads /var/www/html/war-room &&
      rm -rf /var/www/encryption_keys /var/www/html/tickets/attachments /var/www/html/change-management/attachments /var/www/html/uploads /var/www/html/recordings /var/www/html/lms/content /var/www/html/contracts/rfp-builder/uploads /var/www/html/system/uploads/branding /var/www/html/war-room/attachments &&
      ln -s /data/encryption_keys /var/www/encryption_keys &&
      ln -s /data/tickets-attachments /var/www/html/tickets/attachments &&
      ln -s /data/change-management-attachments /var/www/html/change-management/attachments &&
      ln -s /data/uploads /var/www/html/uploads &&
      ln -s /data/recordings /var/www/html/recordings &&
      ln -s /data/lms-content /var/www/html/lms/content &&
      ln -s /data/contracts-rfp-builder-uploads /var/www/html/contracts/rfp-builder/uploads &&
      ln -s /data/system-uploads-branding /var/www/html/system/uploads/branding &&
      ln -s /data/war-room-attachments /var/www/html/war-room/attachments &&
      exec apache2-foreground
      "
    envVars:
      - key: DB_SERVER
        fromService:
          name: freeitsm-db
          type: pserv
          property: host
      - key: DB_NAME
        value: freeitsm
      - key: DB_USERNAME
        value: freeitsm
      - key: DB_PASSWORD
        fromService:
          name: freeitsm-db
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: ENCRYPTION_KEY_PATH
        value: /var/www/encryption_keys/freeitsm.key
    # Single disk holding everything that must survive redeploys; app code
    # under /var/www/html stays baked into the image and untouched.
    disk:
      name: freeitsm-data
      mountPath: /data
      sizeGB: 10

  # MySQL as a private service (Render has no managed MySQL offering)
  - type: pserv
    name: freeitsm-db
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mysql:8.0
    envVars:
      - key: MYSQL_DATABASE
        value: freeitsm
      - key: MYSQL_USER
        value: freeitsm
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: freeitsm-db-data
      mountPath: /var/lib/mysql
      sizeGB: 10
