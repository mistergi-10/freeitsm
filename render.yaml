services:
  # FreeITSM app - pulls the prebuilt image (fast, no build step)
  - type: web
    name: freeitsm
    runtime: image
    plan: starter
    region: oregon
    image:
      url: ghcr.io/edmozley/freeitsm:latest
    envVars:
      - key: DB_SERVER
        fromService:
          name: freeitsm-db
          type: pserv
          property: host
      - key: DB_NAME
        value: freeitsm
      - key: DB_USERNAME
        value: freeitsm
      - key: DB_PASSWORD
        fromService:
          name: freeitsm-db
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: ENCRYPTION_KEY_PATH
        value: /var/www/encryption_keys/freeitsm.key
    # Mounted only here (not /var/www) so the disk doesn't mask the app
    # code baked into the image at /var/www/html on first mount.
    disk:
      name: freeitsm-data
      mountPath: /var/www/encryption_keys
      sizeGB: 10

  # MySQL as a private service (Render has no managed MySQL offering)
  - type: pserv
    name: freeitsm-db
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mysql:8.0
    envVars:
      - key: MYSQL_DATABASE
        value: freeitsm
      - key: MYSQL_USER
        value: freeitsm
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: freeitsm-db-data
      mountPath: /var/lib/mysql
      sizeGB: 10
